---
layout: default
---
<article>
    <header class="post-header">
        <p class="post-date">{{ page.date | date: "%d %B %Y" }}</p>
        <h1 class="post-title">{{ page.title }}</h1>
        {% if page.summary %}
        <p class="post-summary">{{ page.summary }}</p>
        {% endif %}
    </header>

    <div class="post-content">
        {{ content }}
    </div>

    <a class="back-link" href="{{ '/' | relative_url }}#archive">Back to archive</a>
</article>
